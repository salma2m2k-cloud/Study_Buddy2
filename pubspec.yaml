name: study_buddy
description: Study Buddy — a student productivity app with local persistence.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Local persistence — everything the app saves lives on the device,
  # written immediately whenever something changes. No account, no cloud
  # database, no server-side storage of any kind.
  shared_preferences: ^2.3.2

  # Talks to the existing Vercel backend for AI chat only. The OpenRouter
  # key stays on that backend — this app never holds it.
  http: ^1.2.2

  # Simple app-wide state management (a couple of ChangeNotifiers).
  provider: ^6.1.2

  # Date/time formatting.
  intl: ^0.19.0

  # Local (on-device) scheduled notifications for task & class reminders.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  # Used only to read the device's real timezone name, so reminders fire
  # at the correct local time without hardcoding any timezone.
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
